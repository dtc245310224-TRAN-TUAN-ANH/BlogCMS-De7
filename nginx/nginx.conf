worker_processes auto;
pid /tmp/nginx.pid;
error_log /logs/error.log warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
 access_log /logs/access.log json;
 client_max_body_size 100k;
 limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
 upstream app { server web:3000; }
 server {
  listen 8080;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /api/login {
   limit_req zone=login burst=10 nodelay;
   limit_req_status 429;
   include /etc/nginx/proxy-common.conf;
   proxy_pass http://app;
  }
  location / {
   include /etc/nginx/proxy-common.conf;
   proxy_pass http://app;
  }
 }
 # This port is internal only, reachable by nginx-exporter.
 server {
  listen 8081;
  access_log off;
  location = /stub_status { stub_status; }
  location / { return 404; }
 }
}
